[project]
name = "paper-translator"
version = "0.1.0"
description = "Offline paper translator using PLaMo on llama.cpp"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pymupdf>=1.26",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34",
]

[project.scripts]
paper-translator = "paper_translator.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
