[project]
name = "paper-translator"
version = "0.1.0"
description = "Offline paper translator using PLaMo on llama.cpp"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "huggingface-hub>=0.34",
    "pymupdf>=1.26",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34",
]

[project.scripts]
paper-translator = "paper_translator.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/paper_translator/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
